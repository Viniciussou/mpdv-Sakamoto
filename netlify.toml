[build]
  command = "npm run build"
  publish = "dist"

# Cabeçalhos de segurança. A CSP NÃO fica aqui: é gerada no build (scripts/build.mjs) a partir da
# variável de ambiente do Supabase, para nunca divergir da URL usada pelo site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
