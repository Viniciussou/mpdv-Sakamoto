[build]
  publish = "."

# Cabeçalhos de segurança. Ajuste a URL do Supabase em connect-src/img-src se mudar de projeto.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mnyaqzxuzuiaqxkwqyfp.supabase.co; connect-src 'self' https://mnyaqzxuzuiaqxkwqyfp.supabase.co wss://mnyaqzxuzuiaqxkwqyfp.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
